name: CI

# THREE SUPPORTED PLATFORMS — macOS, Linux, Windows — and every one of them gates.
#
# There used to be a fourth category: platforms enabled in CI, reported, and allowed to
# fail. It was well-intentioned and it did not work. "Reported but not gating" is a state
# nobody reads — a leg that is always red is indistinguishable at a glance from the build
# being broken, so it stops being read at all, which is the opposite of what the category
# was for.
#
# So the rule is binary. A platform is supported, tested and gating — or it is not claimed.
#
# macOS and Windows are plain jobs on GitHub-hosted runners rather than calls into
# swiftlang's reusable workflow. That workflow's Apple legs require `[self-hosted, macos]`
# — the Swift project's own fleet — so on any other repository they queue until the 24-hour
# maximum and cancel the run without ever failing. Owning them is both more honest and
# faster.
#
# A platform is only "supported" if CI runs the test suite on it.
# docs/research/cross-platform-audit.md §9 is blunt about the trap here: the standard
# swiftlang reusable workflow tests **Linux and Windows only** out of the box, and every
# other platform is an opt-in flag that defaults to false. That is how libraries end up
# advertising a platform list nobody ever ran.
#
# So every flag below is set explicitly, including the ones that are already the default,
# so that the matrix is readable as a claim rather than inferred from an absence.
#
# One trap worth keeping, because it costs a whole CI run to rediscover: `continue-on-error`
# is NOT a permitted key on a job that calls a reusable workflow. GitHub rejects the entire
# file at parse time, so every other job silently fails to run too — and `yaml.safe_load`
# accepts it happily, which means local validation will not catch it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Linux test matrix. macOS, iOS and Windows are plain jobs below; the cross-compile
  # SDK legs (musl, wasm) stay here because this workflow installs those SDKs for us.
  test:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_linux_checks: true
      # Windows is a plain job below, not this. See the header.
      enable_windows_checks: false
      # macOS and iOS are OFF here and covered by the two jobs below instead. The reusable
      # workflow's Apple legs declare `runs-on: [self-hosted, macos, ...]` — they are built
      # for the Swift project's own runner fleet, and a repository without one does not get
      # a failure, it gets a job that queues forever. Eight of them held a run open for the
      # full 24-hour maximum before GitHub cancelled it, with nothing to show.
      enable_macos_checks: false
      enable_ios_checks: false
      enable_freebsd_checks: false
      # The single most useful flag in the whole cross-platform survey: it turns an
      # accidental transitive import into a build failure. Without it, "AssayCore has no
      # Foundation dependency" is a claim that decays silently. It has already caught one
      # real bug — AssayYAML/AssayXML importing Assay without declaring it.
      swift_flags: "--explicit-target-dependency-import-check error"
      # The reusable workflow defaults to testing 5.9 through nightly. Package.swift
      # declares swift-tools-version 6.2, so 5.9, 5.10, 6.0 and 6.1 cannot resolve the
      # manifest at all — they failed on the first CI run with "using Swift tools version
      # 6.2.0 but the installed version is 6.1.0", which is a fact about the floor rather
      # than a regression. Listed explicitly so the supported range is a claim.
      linux_swift_versions: '["6.2", "6.3", "nightly-main", "nightly-6.4.x"]' 

  # macOS, on a GitHub-hosted runner. This is the leg the reusable workflow cannot provide
  # here, and it is not optional: `A platform is only "supported" if CI runs the test suite
  # on it` is the first line of this file.
  macos:
    name: Test (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select a toolchain new enough for the package
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: swift --version
      - name: Test
        run: swift test --explicit-target-dependency-import-check error

  # iOS, build only. A package cannot be *tested* on a simulator without a scheme and a
  # destination, but it can be built for the platform, which is what catches an accidental
  # AppKit or process-level dependency.
  ios:
    name: Build (iOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select a toolchain new enough for the package
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      # The scheme is DISCOVERED, not hard-coded. Xcode generates `<package>-Package` for
      # a SwiftPM package, but that name is a convention rather than a guarantee, and a
      # workflow that guesses it fails with "scheme not found" — which reads like a broken
      # build rather than a broken workflow.
      - name: Build for iOS
        run: |
          set -euo pipefail
          SCHEME=$(xcodebuild -list -json | python3 -c \
            'import json,sys; d=json.load(sys.stdin); \
             w=d.get("workspace") or d.get("project"); \
             print(next(s for s in w["schemes"] if s.endswith("-Package")))')
          echo "scheme: $SCHEME"
          xcodebuild -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            build

  # Windows. Third of the three, and gating like the other two.
  #
  # A plain job on `windows-latest` with the toolchain installed by a pinned action, which
  # is what a sibling project already runs successfully — rather than the reusable
  # workflow's Windows leg, which was testing Swift 5.9 against a package declaring 6.2 and
  # so could only ever fail on the manifest.
  windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Pinned to a COMMIT, not to a branch. This is a third-party action running in a
      # workflow on this repository; a moving ref means whoever controls that branch
      # chooses what executes here. Bump deliberately: read the diff, then move the SHA.
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - run: swift --version
      - name: Test
        run: swift test --explicit-target-dependency-import-check error

  # Static Linux (musl). Worth its own job because it is the configuration most likely to
  # expose an accidental libc or dlopen dependency.
  static-linux:
    name: Static Linux (musl)
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_macos_checks: false
      enable_linux_static_sdk_build: true

  # WebAssembly. Scoped to the Foundation-free targets: AssayFoundation needs file I/O
  # that WASI only provides behind an explicit directory mount.
  #
  # NOTE for whoever makes this actually run: swift-syntax's wasi-test-toolset.json bumps
  # the stack to 16 MB, and a recursive-descent parser WILL blow the default Wasm stack.
  # Assay's XML and YAML parsers both recurse. Do not skip this.
  wasm:
    name: WebAssembly
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_macos_checks: false
      enable_wasm_sdk_build: true
      swift_flags: "--target AssayCore --target AssayYAML --target AssayXML"

  # The compile-time budget, gated. docs/COMPILE-TIME.md §2.
  #
  # This job triples in wall clock from 2026-08-30, and deliberately: every timing is now the
  # minimum of three builds rather than a single one. CI enforces only the hardware-independent
  # `schema / codable` ratio, and that is precisely the reading sampling helps most — it went
  # from the noisiest number here to stable within 1%. Roughly 10 minutes against a 60 minute
  # Zero warnings, and it is a gate. Until 2026-09-10 the library built with 56 warnings
  # (49 of them StrictMemorySafety), which made `.strictMemorySafety()` decorative: the next
  # genuinely unmarked `unsafe` was invisible in the noise. Not `-warnings-as-errors`: that
  # flag reaches every dependency too, and a swift-syntax warning on a nightly would fail
  # this repository's build for a line it does not own. The grep excludes `.build/`, so it is
  # exactly "our sources and our tests", macro expansions included.
  warnings:
    timeout-minutes: 60
    name: Zero warnings
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Build library and tests, fail on any warning outside .build/
        run: |
          swift build --build-tests 2>&1 | tee build.log
          if grep -E 'warning:' build.log | grep -v '/\.build/' | grep -q .; then
            echo "::error::warnings in Sources/ or Tests/ (see above)"
            grep -E 'warning:' build.log | grep -v '/\.build/'
            exit 1
          fi

  # timeout.
  compile-time:
    timeout-minutes: 60
    name: Compile-time budget
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Gate @Schema expansion cost
        run: Experiments/03-compile-time/gate.sh

  # Corpus determinism. The allocation-count gate (once it exists) depends on the corpus
  # being byte-identical across regenerations, so this is a prerequisite rather than a
  # nicety.
  corpus:
    timeout-minutes: 60
    name: Corpus determinism
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate twice and compare
        working-directory: Benchmarks
        run: |
          swift run -c release CorpusGen
          A=$(find Corpus/files -name '*.json' | sort | xargs shasum | shasum)
          swift run -c release CorpusGen
          B=$(find Corpus/files -name '*.json' | sort | xargs shasum | shasum)
          test "$A" = "$B" || { echo "corpus is not deterministic"; exit 1; }
          echo "deterministic: $A"
      # The cold-start type set is generated too, by a Python script rather than a Swift
      # target, and until 2026-09-10 nothing checked that the checked-in file still
      # matched its generator — the exact drift the corpus job above exists to prevent.
      - name: DecodeWidths.swift matches its generator
        run: |
          Sources/AssayCore/gen-decode-widths.sh > /tmp/DecodeWidths.swift
          diff -q /tmp/DecodeWidths.swift Sources/AssayCore/DecodeWidths.swift \
            || { echo "DecodeWidths.swift is stale — regenerate with gen-decode-widths.sh"; exit 1; }
      - name: ColdStartTypes.swift matches its generator
        run: |
          python3 Benchmarks/gen-coldstart.py > /tmp/ColdStartTypes.swift
          diff -q /tmp/ColdStartTypes.swift Benchmarks/Sources/AssayBench/ColdStartTypes.swift \
            || { echo "ColdStartTypes.swift is stale — regenerate with gen-coldstart.py"; exit 1; }

  # macOS, NOT Linux, and that is a known limitation rather than a preference.
  # DiffFuzz distinguishes an NSNumber holding `true` from one holding `1` with
  # `CFGetTypeID`, and Linux has no CoreFoundation. Benchmarks/RESULTS.md records why the
  # portable substitute was rejected: `strcmp(n.objCType, "c")` compiles everywhere and
  # costs about 20x on macOS, because objCType is a message send per value.
  differential-and-fuzz:
    timeout-minutes: 60
    name: Differential vs Foundation + fuzz (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select a toolchain new enough for the package
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      # Every other step here is `-c release`, and that is exactly how this package sat
      # broken in debug for an unknown length of time: `swift build` in Benchmarks/ failed
      # with `<unknown>:0: error: circular reference`, naming no file, because release
      # builds whole-module and never issues the per-file type-check request that starts
      # the cycle. Debug is what a contributor types first, so it is what CI must cover.
      # See Sources/CorpusGen/JSON.swift for the cycle itself.
      - name: Build debug — release-only CI is how the debug break went unnoticed
        working-directory: Benchmarks
        run: swift build
      - name: Generate the corpus
        working-directory: Benchmarks
        run: swift run -c release CorpusGen
      # The official TOML conformance suite. `DiffFuzz toml-test` reads it from
      # TOML_TEST_DIR and reports every valid document that parses to the wrong value and
      # every invalid document that was accepted; without the checkout it skips, which is
      # why the clone is a separate step that cannot silently be missing.
      - name: Check out toml-test
        uses: actions/checkout@v4
        with:
          repository: toml-lang/toml-test
          path: toml-test
      - name: Differential (JSON.Value vs JSONSerialization) and deterministic fuzz
        working-directory: Benchmarks
        env:
          TOML_TEST_DIR: ${{ github.workspace }}/toml-test
        # Exits nonzero on any value mismatch, crash or hang. The fuzz seed is fixed, so
        # a failure here reproduces exactly — `DiffFuzz --probe yaml '<input>'` shrinks it.
        run: swift run -c release DiffFuzz

  # The allocation gate is macOS-only and that is a platform fact, not an oversight:
  # malloc_zone_statistics gives a live block count, glibc's mallinfo2 gives bytes and no
  # count at all, so on Linux the counter reports "unavailable" and disables itself rather
  # than guessing. Running it here would be decorative.
  allocations:
    timeout-minutes: 60
    name: Allocation gate (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The image's DEFAULT Xcode ships Swift 6.1 and Package.swift declares 6.2, so
      # `swift run` fails on the manifest before touching any code. Picking the newest
      # Xcode present survives image updates better than pinning a version.
      - name: Select a toolchain new enough for the package
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Generate the corpus
        working-directory: Benchmarks
        run: swift run -c release CorpusGen
      - name: Allocation thresholds
        working-directory: Benchmarks
        # The one arm this job exists for. It exits nonzero when a live-block threshold is
        # exceeded. The timing arms are collected and published by benchmark.yml, never
        # gated on: wall clock on a hosted runner is noise wearing a number's clothes —
        # and until 2026-09-10 this job ran all of them for eight minutes to reach the one
        # exit code it wanted.
        run: swift run -c release AssayBench allocations

# NOT GATED, deliberately:
#
#   * Wall clock. Collect it, publish it, never fail on it. Every timing number this
#     workflow prints is informational.
#
#   * `.instructions` on hosted runners. `perf_event_open` fails, there is no PMU, and
#     package-benchmark silently reports ZERO because the diagnostic is commented out — so
#     a threshold on it always passes and the badge proves nothing.
#
# NOT GATED, but wanted — see ROADMAP.md:
#
#   * Total malloc traffic (.mallocCountTotal). The gate above counts LIVE blocks, which
#     misses transient allocations freed inside a decode. Catching those needs jemalloc
#     beside the toolchain, which rules out the musl and wasm legs entirely.
