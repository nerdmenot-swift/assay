name: Docs

# The website. Builds on any change under website/, deploys to Cloudflare Pages from main.
#
# `astro build` rather than `bun run build`, deliberately: the latter runs the extract
# script, which needs a Swift toolchain to rebuild the example renders. Those renders are
# committed, so the deploy leg does not need Swift — and the staleness check below is what
# keeps "committed" honest.

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/docs.yml']
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run astro build
      # A smoke gate rather than a snapshot: a build that silently produces three pages
      # is the failure worth catching, and it has happened to other people.
      - name: The build produced a site
        run: |
          test -f dist/index.html
          n=$(find dist -name '*.html' | wc -l)
          echo "pages: $n"
          test "$n" -ge 20
      # Internal links, because a docs site whose sidebar 404s is worse than no site.
      # Anchors too: a heading gets reworded far more often than a page gets deleted, and
      # a dead #fragment lands the reader at the top of a long page with no idea why.
      - name: No broken internal links
        run: |
          python3 - <<'PY'
          import re, os, sys
          root = 'dist'
          pages, ids = set(), {}
          for d, _, fs in os.walk(root):
              for f in fs:
                  if f != 'index.html':
                      continue
                  rel = os.path.relpath(d, root).replace('.', '').strip('/')
                  slug = ('/' + rel + '/').replace('//', '/')
                  pages.add(slug)
                  ids[slug] = set(re.findall(r'id="([^"]+)"', open(os.path.join(d, f)).read()))
          bad = []
          for d, _, fs in os.walk(root):
              for f in fs:
                  if not f.endswith('.html'):
                      continue
                  src = open(os.path.join(d, f)).read()
                  here = os.path.join(d, f)
                  for href in re.findall(r'href="(/[^"?]*)"', src):
                      if href.startswith('/_') or href.endswith(('.svg', '.png', '.xml', '.js', '.css', '.ico')):
                          continue
                      page, _, anchor = href.partition('#')
                      h = page if page.endswith('/') else page + '/'
                      if h not in pages:
                          bad.append((here, href, 'no such page'))
                      elif anchor and anchor not in ids[h]:
                          bad.append((here, href, 'no such anchor'))
          for src, h, why in sorted(set(bad)):
              print(f'BROKEN {h} in {src} ({why})')
          sys.exit(1 if bad else 0)
          PY

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run astro build
        working-directory: website
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=assay-docs
