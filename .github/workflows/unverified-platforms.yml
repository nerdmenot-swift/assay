name: Unverified platforms

# Windows and Android, reported and NEVER gating.
#
# `CLAUDE.md`'s honesty rules say a platform is only supported if CI runs the suite on it,
# and neither of these has ever run. So they must not be able to fail a release they have
# never participated in — but they must still be visible, or "unverified" quietly becomes
# "forgotten".
#
# This is a SEPARATE WORKFLOW rather than `continue-on-error: true` inside `ci.yml`, and
# that is a constraint rather than a preference: `continue-on-error` is not a permitted key
# on a job that calls a reusable workflow, and using it there rejects the entire file at
# parse time. That is exactly what happened on this repository's first ever CI run.
#
# The day either of these is green and stays green, move it into `ci.yml` and let it gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows has NEVER run (the honesty rules forbid claiming it), so it must not be able
  # to block a release it has never participated in. It reports, it does not gate;
  # the day it is green and stays green, delete continue-on-error and move it back into
  # the required job.
  windows:
    name: Windows
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_linux_checks: false
      enable_windows_checks: true
      enable_macos_checks: false
      # Same floor as the Linux matrix in ci.yml: Package.swift declares
      # swift-tools-version 6.2, so 5.9 and 5.10 cannot resolve the manifest. Without this
      # the report is noise about an unsupportable toolchain rather than news about Windows.
      windows_swift_versions: '["6.2", "6.3", "nightly-main"]' 

  # Android, on an emulator. Macro cross-compilation to Android was the historical blocker
  # and was fixed in SwiftPM #8670. Same posture as Windows: never run, so non-blocking
  # until it has a green history.
  android:
    name: Android
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_macos_checks: false
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
