<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Assay">
  <!-- Two braces that splay into a flask, holding one bead of molten gold: the sample
       the assay is run on. Drawn in Recraft, then recoloured and cleaned here.

       The braces ARE the portal's accent rather than a colour of their own: the in-page
       cuts read the accent custom property, the tile carries the literal red, so the mark
       cannot drift away from the site. Petrol and oxblood were both tried first; both were
       a second red-adjacent hue in a portal that already had one.

       The bead is #ffc61a, not the muted #c99a2e, for a measured reason: mustard on this
       red is 2.10:1, under the 3:1 floor for a non-text element, and the bright amber is
       3.44:1. On paper the bead reads off the brace feet beside it rather than off the
       page, which is why brightening it costs nothing there. -->
