<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Assay">
  <rect width="64" height="64" rx="12" fill="#1a1816"/>
  <!-- A conical flask whose neck is a brace pair. One continuous outline at one weight,
       a gold reagent line, and nothing else: earlier cuts put a swift or a caret in the
       liquid and both turned to a smudge by 32 px, which is the size that decides whether
       a mark works. The brace is the whole idea and it is the part that survives. -->
  <path d="M19.6 40.6 C23.4 38.4 28.0 41.6 32.0 41.0 C36.0 40.4 40.0 38.4 44.4 40.6 L52.0 52.9 H12.0 Z" fill="#c99a2e"/>
  <path d="M30.2 9 H27.2 V16 L21.6 21.2 L27.2 26.4 V29 L9.8 50.6 Q7.4 55 12.2 55 H51.8 Q56.6 55 54.2 50.6 L36.8 29 V26.4 L42.4 21.2 L36.8 16 V9 H33.8" fill="none" stroke="#f3efe6" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6"/>
</svg>
