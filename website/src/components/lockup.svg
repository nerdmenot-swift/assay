<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 134 44" role="img" aria-label="Assay">
  <!-- A conical flask whose neck is a brace pair, then the wordmark.

       The glass is `currentColor`, so the header takes the page's text colour and one
       drawing serves both themes; the gold is fixed, because it is what ties this to the
       tab icon. Earlier cuts put a swift or a caret in the liquid — both turned to a
       smudge well before 32 px, and the brace is the idea worth keeping anyway.

       The box is tight to the ink (it ends at x=128). At 220 wide, against the same 7rem
       container, 42% of the lockup was empty and the mark rendered about 17 px tall.
       `textLength` pins the wordmark so tightening the box cannot clip the last letter
       when the webfont has not loaded and the fallback measures wider. -->
  <g transform="translate(-3.8 -3.1) scale(0.783)">
    <path d="M19.6 40.6 C23.4 38.4 28.0 41.6 32.0 41.0 C36.0 40.4 40.0 38.4 44.4 40.6
             L52.0 52.9 H12.0 Z" fill="#c99a2e"/>
    <path d="M30.2 9 H27.2 V16 L21.6 21.2 L27.2 26.4 V29
             L9.8 50.6 Q7.4 55 12.2 55 H51.8 Q56.6 55 54.2 50.6 L36.8 29
             V26.4 L42.4 21.2 L36.8 16 V9 H33.8"
          fill="none" stroke="currentColor" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6"/>
  </g>
  <text x="48" y="31" textLength="80" lengthAdjust="spacingAndGlyphs"
        font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700"
        font-size="28" fill="currentColor">Assay</text>
</svg>
