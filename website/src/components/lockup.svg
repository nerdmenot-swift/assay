<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 134 44" role="img" aria-label="Assay">
  <!-- The mark: a flask whose neck is a brace, with a swift in the liquid.

       The bird and the liquid surface are KNOCKED OUT rather than painted, which is what
       the mask is for: the page shows through them, so one drawing works on paper and on
       ink with no theme switch. The gold is fixed — it is the brand colour, and it is the
       one thing that makes the tab icon and this header the same object.

       The box is tight to the ink (content ends at x=128) because it was 220 wide against
       the same 7rem container, so 42% of the lockup was empty and the mark rendered at
       about 17px. `textLength` pins the wordmark's width so tightening it cannot clip the
       last letter when the webfont has not loaded and the fallback measures wider. -->
  <mask id="assay-flask">
    <g transform="translate(-6.37 -4.46) scale(0.823)">
      <path d="M28.6 13.4 H25.4 V17.6 L22.2 21 L25.4 24.4 V27.4" fill="none" stroke="#fff"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M35.4 13.4 H38.6 V17.6 L41.8 21 L38.6 24.4 V27.4" fill="none" stroke="#fff"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path fill="#fff"
            d="M25.9 26.6 L17.4 46.2 Q15.4 52.8 22.3 52.8 L41.7 52.8 Q48.6 52.8 46.6 46.2 L38.1 26.6 Z"/>
      <path d="M23.0 34.4 C26.6 32.0 29.8 34.6 33.2 34.0 C36.4 33.5 38.8 32.0 41.0 31.8"
            fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
      <path fill="#000" transform="rotate(22 31 41) translate(-0.8 1.4) scale(0.94) translate(1.9 2.6)"
            d="M37.2 32.8 C39.0 36.2 39.5 41.2 37.5 45.4 C37.1 46.3 36.6 46.8 36.2 46.5
               C35.0 45.9 34.3 43.5 34.3 40.4 C34.3 37.2 35.6 34.4 37.2 32.8 Z
               M36.9 44.9 Q29.8 47.8 22.4 45.3 Q29.6 45.3 35.7 42.6 Z
               M35.7 40.6 Q29.4 43.4 23.8 40.0 Q30.3 40.9 34.6 38.3 Z
               M35.6 36.4 Q30.8 38.4 26.6 34.7 Q31.5 36.0 36.4 32.9 Z"/>
    </g>
  </mask>
  <rect width="44" height="44" fill="#c99a2e" mask="url(#assay-flask)"/>
  <text x="48" y="31" textLength="80" lengthAdjust="spacingAndGlyphs"
        font-family="Bricolage Grotesque, Public Sans, sans-serif" font-weight="700"
        font-size="28" fill="currentColor">Assay</text>
</svg>
